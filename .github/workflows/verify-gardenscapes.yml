name: Verify Gardenscapes repair
on:
  pull_request:
    paths: ['native/gardenscapes/**', 'patches/**', 'scripts/build_gardenscapes_payload.py', '.github/workflows/verify-gardenscapes.yml']
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install native linker
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld
      - name: Test production logic and build ARM64 payload
        run: python3 scripts/build_gardenscapes_payload.py
      - name: Compile patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gardenscapes-repair-test
          path: |
            patches/build/libs/*.mpp
            patches/src/main/resources/gardenscapes/repair-arm64.b64
            patches-list.json
          if-no-files-found: error
