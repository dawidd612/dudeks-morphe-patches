name: Verify Calendar widget patch
on:
  pull_request:
    paths:
      - 'extensions/calendar/**'
      - 'patches/src/main/kotlin/app/template/patches/calendar/**'
      - 'scripts/test_calendar_widget_rows.py'
      - 'scripts/VerifyCalendarWidgetDex.java'
      - '.github/workflows/verify-calendar.yml'
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check row replacement contract and guards
        run: python3 scripts/test_calendar_widget_rows.py
      - name: Compile patch bundle and metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dudeks-calendar-widget-candidate
          path: |
            patches/build/libs/*.mpp
            patches-list.json
          if-no-files-found: error
