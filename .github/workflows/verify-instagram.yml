name: Verify Instagram add-on

on:
  push:
    branches: [feature/instagram-dm-keep-scroll-position, fix/instagram-dm-scroll-offset]
  pull_request:
    paths:
      - 'extensions/**'
      - 'patches/**'
      - '*gradle*'
      - 'scripts/test_instagram_dm_hook.py'
      - '.github/workflows/verify-instagram.yml'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test reply guard behavior
        run: python3 scripts/test_instagram_dm_hook.py
      - name: Compile patches and Instagram extension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dudeks-patches-instagram
          path: |
            patches/build/libs/*.mpp
            patches-list.json
          if-no-files-found: error
